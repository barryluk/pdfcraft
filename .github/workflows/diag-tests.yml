name: Diagnose tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test touched crates, report failures as annotations
        shell: bash
        run: |
          set +e
          for c in pdfcraft-annot pdfcraft-engine pdfcraft-ui-egui; do
            cargo test -p $c --no-fail-fast > $c.log 2>&1
            echo "::notice::$c exit $?"
            grep -E "^test .* FAILED|^error(\[|:)" $c.log | head -20 | while read -r l; do echo "::error::$c: $l"; done
            grep -E "panicked at" -A4 $c.log | head -30 | tr '\n' ' ' | cut -c1-3000 | sed 's/^/::error::panic: /'; echo
          done
